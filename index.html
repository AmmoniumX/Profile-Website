<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
.card {
  background-color: #ECDFCC;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  max-width: 300px;
  margin: auto;
  text-align: center;
  font-family: arial;
}

.title {
  color: grey;
  font-size: 18px;
}

button {
  border: none;
  outline: 0;
  display: inline-block;
  padding: 8px;
  color: white;
  background-color: #697565;
  text-align: center;
  cursor: pointer;
  width: 100%;
  font-size: 18px;
}

a {
  text-decoration: none;
  font-size: 22px;
  color: black;
}

button:hover, a:hover {
  opacity: 0.7;
}

.icon-container {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 24px 0;
}

.icon-spacing i {
  font-size: 24px;
}

</style>
</head>
<body style="background-color: #181C14;">

<div class="card">
  <img src="./profile.jpg" alt="Profile" style="width:100%">
  <h1>Diego Garcia</h1>
  <p class="title">Software Developer</p>
  <p>Constructor University</p>
  <div class="icon-container">
    <a href="mailto:diego.garcia.cr@gmail.com"><i class="fa fa-envelope"></i></a>
    <a href="https://github.com/AmmoniumX"><i class="fa fa-github"></i></a> 
    <a href="https://www.linkedin.com/in/diegogarcia03/"><i class="fa fa-linkedin"></i></a>  
  </div>
  <p>
    <a href="./cv.pdf" download="Diego_Garcia.pdf"><button>Download CV</button></a>
  </p>
</div>

</body>
</html>
